name: discipline_ai
description: Premium AI-powered self-discipline app for habits, water, exercise, journaling, streaks, and voice coaching.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_messaging: ^15.2.8
  google_sign_in: ^6.3.0
  http: ^1.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  go_router: ^15.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
